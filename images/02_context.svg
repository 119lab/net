<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#ffffff"/><rect width="1080" height="18" fill="#cf2937"/><text x="82" y="100" fill="#102b45" font-size="28" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="100" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">消防を科学する。</text><path d="M82 130H998" stroke="#d7e1e8" stroke-width="2"/><text x="82" y="300" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="64" font-weight="800" text-anchor="start"><tspan x="82" dy="0">消防の現場は、</tspan><tspan x="82" dy="76">変わり続けている</tspan></text><rect x="82" y="460" width="916" height="3" fill="#cf2937"/><text x="82" y="535" fill="#cf2937" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="82" dy="0">長年培われた経験と知恵。</tspan></text><text x="82" y="625" fill="#152b3d" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="31" font-weight="500" text-anchor="start"><tspan x="82" dy="0">災害の複雑化、社会環境の変化、ICTや新技術の進展。</tspan><tspan x="82" dy="51">消防に求められる役割も変わっています。</tspan></text><rect x="82" y="820" width="916" height="92" rx="18" fill="#edf3f6"/><text x="118" y="878" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="118" dy="0">だから、現場の知識をつなぐ。</tspan></text><text x="82" y="1010" fill="#536879" font-size="22" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="1010" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">02 / 06</text></svg>