<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#ffffff"/><rect width="1080" height="18" fill="#cf2937"/><text x="82" y="100" fill="#102b45" font-size="28" font-family="Arial,sans-serif" font-weight="700">119LAB.</text><text x="998" y="100" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">消防を科学する。</text><path d="M82 130H998" stroke="#d7e1e8" stroke-width="2"/><text x="82" y="340" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="62" font-weight="800" text-anchor="start"><tspan x="82" dy="0">ともに考え、</tspan><tspan x="82" dy="76">ともに学び、</tspan><tspan x="82" dy="76">ともに成長する。</tspan></text><rect x="82" y="585" width="916" height="3" fill="#cf2937"/><text x="82" y="670" fill="#152b3d" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="33" font-weight="600" text-anchor="start"><tspan x="82" dy="0">消防の現在を見つめ、未来につながる情報を。</tspan></text><text x="82" y="755" fill="#536879" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="30" font-weight="500" text-anchor="start"><tspan x="82" dy="0">「消防を科学する。」を原点に、</tspan><tspan x="82" dy="46">119LAB.と119LAB.netは発信していきます。</tspan></text><rect x="82" y="850" width="916" height="90" rx="45" fill="#cf2937"/><text x="540" y="907" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="29" font-weight="700" text-anchor="middle"><tspan x="540" dy="0">記事・最新情報は 119LAB.net へ</tspan></text><text x="82" y="1010" fill="#536879" font-size="22" font-family="Arial,sans-serif" font-weight="700">119LAB.</text><text x="998" y="1010" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">06 / 06</text></svg>