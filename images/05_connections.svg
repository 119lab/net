<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#ffffff"/><rect width="1080" height="18" fill="#cf2937"/><text x="82" y="100" fill="#102b45" font-size="28" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="100" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">消防を科学する。</text><path d="M82 130H998" stroke="#d7e1e8" stroke-width="2"/><text x="82" y="290" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="58" font-weight="800" text-anchor="start"><tspan x="82" dy="0">職種や地域を越えて、</tspan><tspan x="82" dy="70">知識と経験をつなぐ</tspan></text><rect x="82" y="440" width="916" height="250" rx="24" fill="#edf3f6"/><text x="122" y="510" fill="#cf2937" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="122" dy="0">消火・救急・救助・予防・通信指令・広報・総務。</tspan></text><text x="122" y="575" fill="#152b3d" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="31" font-weight="500" text-anchor="start"><tspan x="122" dy="0">消防現場と企業、研究機関もつなぎ、</tspan><tspan x="122" dy="48">新しい技術や発想が生まれるきっかけをつくります。</tspan></text><circle cx="145" cy="780" r="9" fill="#cf2937"/><circle cx="200" cy="780" r="9" fill="#cf2937"/><circle cx="255" cy="780" r="9" fill="#cf2937"/><path d="M145 780H255" stroke="#cf2937" stroke-width="3"/><text x="82" y="870" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="82" dy="0">現場の声から、次の一歩へ。</tspan></text><text x="82" y="1010" fill="#536879" font-size="22" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="1010" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">05 / 06</text></svg>