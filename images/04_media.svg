<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#ffffff"/><rect width="1080" height="18" fill="#cf2937"/><text x="82" y="100" fill="#102b45" font-size="28" font-family="Arial,sans-serif" font-weight="700">119LAB.</text><text x="998" y="100" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">消防を科学する。</text><path d="M82 130H998" stroke="#d7e1e8" stroke-width="2"/><text x="82" y="275" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="48" font-weight="800" text-anchor="start"><tspan x="82" dy="0">紙とWeb、それぞれの形で</tspan></text><rect x="82" y="325" width="916" height="245" rx="24" fill="#102b45"/><rect x="82" y="325" width="14" height="245" rx="7" fill="#cf2937"/><text x="122" y="395" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="36" font-weight="700" text-anchor="start"><tspan x="122" dy="0">119LAB.net｜フリーペーパー</tspan></text><text x="122" y="455" fill="#e5edf3" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="29" font-weight="500" text-anchor="start"><tspan x="122" dy="0">特集記事や事例紹介を掘り下げ、</tspan><tspan x="122" dy="44">現場で役立つ情報を全国の消防職員へ。</tspan></text><rect x="82" y="610" width="916" height="245" rx="24" fill="#edf3f6"/><rect x="82" y="610" width="14" height="245" rx="7" fill="#cf2937"/><text x="122" y="680" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="34" font-weight="700" text-anchor="start"><tspan x="122" dy="0">119LAB.net｜オンラインメディア</tspan></text><text x="122" y="748" fill="#152b3d" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="29" font-weight="500" text-anchor="start"><tspan x="122" dy="0">Web記事やショート動画で、消防の情報を</tspan><tspan x="122" dy="43">迅速に、わかりやすく。</tspan></text><text x="82" y="1010" fill="#536879" font-size="22" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="1010" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">04 / 06</text></svg>