<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#ffffff"/><rect width="1080" height="18" fill="#cf2937"/><text x="82" y="100" fill="#102b45" font-size="28" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="100" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">消防を科学する。</text><path d="M82 130H998" stroke="#d7e1e8" stroke-width="2"/><circle cx="900" cy="275" r="110" fill="#edf3f6"/><path d="M818 275h164M900 193v164" stroke="#cf2937" stroke-width="4"/><text x="82" y="330" fill="#102b45" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="60" font-weight="800" text-anchor="start"><tspan x="82" dy="0">経験を共有し、</tspan><tspan x="82" dy="72">新しい知識を学ぶ</tspan></text><text x="82" y="515" fill="#cf2937" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="35" font-weight="700" text-anchor="start"><tspan x="82" dy="0">そして、従来の常識を問い直す。</tspan></text><rect x="82" y="565" width="916" height="210" rx="22" fill="#edf3f6"/><text x="122" y="640" fill="#152b3d" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="32" font-weight="500" text-anchor="start"><tspan x="122" dy="0">現場の経験と、新しい技術・知識。</tspan><tspan x="122" dy="52">どちらも持ち寄り、消防の今を考えます。</tspan></text><text x="82" y="860" fill="#536879" font-family="-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif" font-size="23" font-weight="500" text-anchor="start"><tspan x="82" dy="0">記事の要約｜119LAB.net「発信にあたって」</tspan></text><text x="82" y="1010" fill="#536879" font-size="22" font-family="Arial,sans-serif" font-weight="700">119LAB.net</text><text x="998" y="1010" fill="#536879" font-size="22" text-anchor="end" font-family="Arial,sans-serif">03 / 06</text></svg>